<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Login O365</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #242424;
      background:
		linear-gradient(
			rgba(0, 0, 0, 0.55),
			rgba(0, 0, 0, 0.55)
		),
		url("./fundo-logo.png") center center / cover no-repeat;

background-attachment: fixed;
      display: grid;
      place-items: center;
      padding: 48px 24px 80px;
      overflow-x: hidden;
      isolation: isolate;
    }

    /* Formas decorativas suaves no fundo. */


body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: -1;
      border: 2px solid rgb(255 255 255 / 65%);
      border-radius: 90px;
      background: linear-gradient(
        130deg,
        rgb(224 244 255 / 40%),
        rgb(255 255 255 / 65%),
        rgb(240 232 249 / 25%)
      );
      box-shadow: 0 0 90px rgb(255 255 255 / 65%);
    }

    body::before {
      width: 1000px;
      height: 430px;
      left: -180px;
      bottom: -180px;
      transform: rotate(38deg);
    }

    body::after {
      width: 850px;
      height: 370px;
      right: -250px;
      top: -170px;
      transform: rotate(-24deg);
    }

    .portal {
      width: min(100%, 440px);
    }

    .card {
      background: #fff;
      padding: 42px 44px 36px;
      box-shadow: 0 2px 7px rgb(0 0 0 / 19%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: #555;
      font-size: 20px;
      font-weight: 600;
    }

    .brand-icon {
      width: 27px;
      height: 27px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1674c5, #65c9dc);
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #eef5fc;
      color: #245d89;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .6px;
    }

    h1 {
      margin: 15px 0 14px;
      font-size: 25px;
      font-weight: 600;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    .divider {
      height: 1px;
      background: #ccc;
      margin: 22px 0;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 28px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .primary {
      border: 0;
      min-width: 108px;
      padding: 9px 22px;
      color: white;
      background: #086bb5;
      font-size: 14px;
    }

    .primary:hover {
      background: #005a9e;
    }

    button:focus-visible {
      outline: 3px solid #242424;
      outline-offset: 4px;
    }

    .options {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      margin-top: 16px;
      padding: 15px 44px;
      border: 0;
      background: #fff;
      color: #444;
      text-align: left;
      font-size: 14px;
      box-shadow: 0 2px 5px rgb(0 0 0 / 17%);
    }

    .options:hover {
      background: #f8f8f8;
    }

    .info-icon {
      display: grid;
      place-items: center;
      width: 21px;
      height: 21px;
      border: 1.5px solid #666;
      border-radius: 50%;
      font-family: Georgia, serif;
      font-weight: bold;
    }

    .message {
      margin: 20px 0 0;
      color: #245d89;
    }

    .message:empty {
      display: none;
    }

    footer {
      position: fixed;
      right: 24px;
      bottom: 15px;
      left: 24px;
      text-align: right;
      font-size: 11px;
      color: #666;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 20px 70px;
      }

      .card {
        padding: 30px 26px;
      }

      .options {
        padding: 15px 26px;
      }

      footer {
        text-align: center;
      }
    }
	body::before,
body::after {
  display: none;
}
	 .user-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  </style>
</head>
